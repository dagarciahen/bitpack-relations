[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitpack-relations"
version = "0.1.0"
description = "Generate relation tables from a declarative schema"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dbfread>=2.0.7",
    "pandas>=2.2",
    "simpledbf>=0.2.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bitpack-relations = "bitpack_relations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
